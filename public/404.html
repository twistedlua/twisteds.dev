<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="robots" content="noindex" />
    <title>Redirecting...</title>
    <script>
      const isProjectPage = window.location.hostname.endsWith('github.io')
      const pathSegmentsToKeep = isProjectPage ? 1 : 0
      const pathSegments = window.location.pathname.split('/')
      const basePath = pathSegments
        .slice(0, pathSegmentsToKeep + 1)
        .join('/')
      const routePath = pathSegments
        .slice(pathSegmentsToKeep + 1)
        .join('/')
      const query = window.location.search
        ? `&${window.location.search.slice(1).replaceAll('&', '~and~')}`
        : ''

      window.location.replace(
        `${window.location.origin}${basePath}/?/${routePath}${query}${window.location.hash}`,
      )
    </script>
  </head>
  <body></body>
</html>
