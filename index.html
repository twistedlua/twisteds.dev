    <script>
      if (window.location.search.startsWith('?/')) {
        const redirectParts = window.location.search.slice(2).split('&')
        const routePath = redirectParts.shift()
        const routeQuery = redirectParts.join('&').replaceAll('~and~', '&')
        const query = routeQuery ? `?${routeQuery}` : ''

        window.history.replaceState(
          null,
          '',
          `${window.location.pathname}${routePath}${query}${window.location.hash}`,
        )
      }
    </script>
